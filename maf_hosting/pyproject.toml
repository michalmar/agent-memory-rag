[project]
name = "agent-memory-rag-maf-hosting"
version = "0.1.0"
description = "Shared hosting foundation for the project's Foundry MAF agents"
requires-python = ">=3.11"
dependencies = [
  "azure-ai-agentserver-core==2.0.0b8",
  "azure-identity==1.25.1",
  "httpx==0.28.1",
  "microsoft-opentelemetry==1.3.5",
  "starlette==1.3.1",
]

[tool.setuptools]
packages = ["maf_hosting"]
package-dir = { maf_hosting = "." }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
