# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: directive-rag-maf-hosted
services:
    ai-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    directive-rag-maf-hosted:
        project: src/directive-rag-maf
        host: azure.ai.agent
        language: docker
        image: ${DIRECTIVE_HOSTED_AGENT_IMAGE}
        docker:
            path: Dockerfile
            context: ../../../..
            remoteBuild: true
        uses:
            - ai-project
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Enterprise directive assistant implemented with Microsoft Agent Framework.
        environmentVariables:
            - name: DIRECTIVE_MODEL_DEPLOYMENT
              value: ${DIRECTIVE_MODEL_DEPLOYMENT}
            - name: DIRECTIVE_MAX_ITERATIONS
              value: ${DIRECTIVE_MAX_ITERATIONS}
            - name: DIRECTIVE_AGENT_RELEASE_ID
              value: ${DIRECTIVE_AGENT_RELEASE_ID}
            - name: APP_TOOL_GATEWAY_URL
              value: ${APP_TOOL_GATEWAY_URL}
            - name: APP_TOOL_GATEWAY_SCOPE
              value: ${APP_TOOL_GATEWAY_SCOPE}
            - name: ENTRA_TENANT_ID
              value: ${ENTRA_TENANT_ID}
        kind: hosted
        name: directive-rag-maf-hosted
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
